<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Officer Dashboard — DCMS</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/animations.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    .dash-layout{display:flex;min-height:calc(100vh - 66px);padding-top:66px;}
    .sidebar{width:230px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);padding:28px 0;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;}
    .sidebar-section{margin-bottom:22px;}
    .sidebar-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-d);padding:0 20px;margin-bottom:8px;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:.9rem;color:var(--text-m);border-left:3px solid transparent;text-decoration:none;transition:all .2s;}
    .sidebar-link:hover,.sidebar-link.active{color:var(--text);background:rgba(255,255,255,.04);}
    .sidebar-link.active{border-left-color:var(--accent);background:rgba(47,128,237,.07);color:var(--accent);}
    .sidebar-icon{font-size:1rem;width:20px;text-align:center;}
    .dash-main{flex:1;padding:36px 40px;overflow-x:hidden;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
    .topbar h1{font-family:var(--font-h);font-size:1.6rem;}
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
    .kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px;display:flex;align-items:center;gap:14px;transition:all .2s;}
    .kpi:hover{border-color:var(--border-l);transform:translateY(-2px);}
    .kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
    .kpi-val{font-family:var(--font-h);font-size:1.6rem;}
    .kpi-lbl{font-size:.75rem;color:var(--text-d);}
    .section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;margin-bottom:24px;}
    .section-card-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .section-card-head h3{font-family:var(--font-h);font-size:1.1rem;}
    .c-row{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid rgba(30,43,66,.4);flex-wrap:wrap;transition:background .15s;}
    .c-row:last-child{border-bottom:none;}
    .c-row:hover{background:rgba(255,255,255,.02);}
    .priority-badge{font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
    .prio-high{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25);}
    .prio-medium{background:rgba(251,191,36,.1);color:var(--yellow);border:1px solid rgba(251,191,36,.2);}
    .prio-low{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.2);}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);z-index:300;display:none;align-items:center;justify-content:center;}
    .modal-bg.open{display:flex;}
    .modal{background:var(--bg-card);border:1px solid var(--border-l);border-radius:16px;padding:32px;width:100%;max-width:500px;animation:fadeIn .25s ease;}
    .modal h3{font-family:var(--font-h);font-size:1.3rem;margin-bottom:20px;}
    .empty-state{padding:40px;text-align:center;color:var(--text-d);}
    @media(max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:700px){.sidebar{display:none;}.dash-main{padding:20px 16px;}}
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><span class="brand-icon">⬡</span><span class="brand-text">DCMS</span></a>
      <ul class="nav-links">
        <li><a href="officer-dashboard.html" class="active">Dashboard</a></li>
        <li><a href="track.html">Track</a></li>
        <li><a href="reports.html">Reports</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Officer Panel</div>
        <a href="officer-dashboard.html" class="sidebar-link active"><span class="sidebar-icon">🏠</span> My Assignments</a>
        <a href="track.html" class="sidebar-link"><span class="sidebar-icon">🔍</span> Search Complaint</a>
        <a href="reports.html" class="sidebar-link"><span class="sidebar-icon">📋</span> Reports</a>
        <a href="departments.html" class="sidebar-link"><span class="sidebar-icon">🏢</span> Departments</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Account</div>
        <a href="profile.html" class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a>
        <a href="#" class="sidebar-link" onclick="dcmsLogout()"><span class="sidebar-icon">🚪</span> Logout</a>
      </div>
    </aside>

    <main class="dash-main" id="dashMain">
      <div style="padding:60px;text-align:center;color:var(--text-d);">
        <div style="font-size:2rem;margin-bottom:12px;">⏳</div>
        <p>Loading officer dashboard…</p>
      </div>
    </main>
  </div>

  <!-- Update Modal -->
  <div class="modal-bg" id="updateModal">
    <div class="modal">
      <h3>Update Complaint <span id="modalId" style="color:var(--accent);font-family:var(--font-m);font-size:1rem;"></span></h3>
      <input type="hidden" id="modalCmpId"/>
      <div class="form-group">
        <label class="form-label">Update Status</label>
        <select class="form-input" id="newStatus">
          <option value="open">Open</option>
          <option value="in-progress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="escalated">Escalated</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Officer Remarks *</label>
        <textarea class="form-input" rows="3" id="officerRemarks" placeholder="Describe the action taken or current status…"></textarea>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Estimated Resolution Date</label>
        <input type="date" class="form-input" id="estDate"/>
      </div>
      <div style="display:flex;gap:10px;margin-top:22px;">
        <button class="btn-primary" style="flex:1;" onclick="saveUpdate()">Save Update</button>
        <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    requireAuth();
    dcmsUpdateNav();
    dcmsSeedData();

    const u = dcmsGetUser();

    const SMAP = {
      'open':        { badge:'status-open',    label:'● Open' },
      'in-progress': { badge:'status-progress', label:'◐ In Progress' },
      'resolved':    { badge:'status-resolved', label:'✓ Resolved' },
      'escalated':   { badge:'status-open',     label:'⬆ Escalated' }
    };
    const PRI = { low:'prio-low', medium:'prio-medium', high:'prio-high' };

    // Store loaded complaints for modal access
    let _allComplaints = [];

    function cRow(c) {
      const sm  = SMAP[c.status] || SMAP['open'];
      const cid = c.cmpId || c.id || '';
      return `<div class="c-row">
        <div style="flex:1;min-width:0;">
          <div style="font-family:var(--font-m);font-size:.75rem;color:var(--text-d);">#${cid} · ${(c.date||'').split('T')[0]}</div>
          <div style="font-size:.9rem;font-weight:500;">${c.title}</div>
          <div style="font-size:.78rem;color:var(--text-d);">${c.citizenName||'—'} · ${c.dept||c.category||'—'}</div>
        </div>
        <span class="priority-badge ${PRI[c.priority]||'prio-medium'}">${c.priority||'medium'}</span>
        <span class="status-badge ${sm.badge}">${sm.label}</span>
        <button class="btn-outline" style="padding:6px 14px;font-size:.82rem;white-space:nowrap;" onclick="openUpdate('${cid}')">Update →</button>
      </div>`;
    }

    function renderDash(allComplaints) {
      _allComplaints = allComplaints;
      const pending  = allComplaints.filter(c => c.status !== 'resolved' && c.status !== 'closed');
      const resolved = allComplaints.filter(c => c.status === 'resolved');
      const slaRisk  = pending.filter(c => {
        const days = (Date.now() - new Date(c.date).getTime()) / 86400000;
        return days > 3 && c.priority === 'high';
      });
      const inProg = pending.filter(c => c.status === 'in-progress');

      document.getElementById('dashMain').innerHTML = `
        <div class="topbar">
          <div>
            <h1>Officer Dashboard 🏢</h1>
            <p style="color:var(--text-m);font-size:.9rem;">${u ? u.name : 'Officer'} · ${u ? (u.dept||'All Departments') : '—'} ·
              <span style="color:var(--accent);">${pending.length} complaint${pending.length!==1?'s':''} pending</span>
            </p>
          </div>
          <button class="btn-ghost" onclick="showToast && showToast('Report exported!','success')">📥 Export Report</button>
        </div>

        <div class="kpi-row">
          <div class="kpi reveal">
            <div class="kpi-icon" style="background:rgba(47,128,237,.12);">📋</div>
            <div><div class="kpi-val" data-target="${pending.length}">${pending.length}</div><div class="kpi-lbl">Pending</div></div>
          </div>
          <div class="kpi reveal reveal-d1">
            <div class="kpi-icon" style="background:rgba(251,191,36,.1);">⏳</div>
            <div><div class="kpi-val" style="color:var(--yellow);" data-target="${inProg.length}">${inProg.length}</div><div class="kpi-lbl">In Progress</div></div>
          </div>
          <div class="kpi reveal reveal-d2">
            <div class="kpi-icon" style="background:rgba(248,113,113,.1);">🚨</div>
            <div><div class="kpi-val" style="color:var(--red);" data-target="${slaRisk.length}">${slaRisk.length}</div><div class="kpi-lbl">SLA Risk</div></div>
          </div>
          <div class="kpi reveal reveal-d3">
            <div class="kpi-icon" style="background:rgba(52,211,153,.1);">✅</div>
            <div><div class="kpi-val" style="color:var(--green);" data-target="${resolved.length}">${resolved.length}</div><div class="kpi-lbl">Resolved Total</div></div>
          </div>
        </div>

        <div class="section-card reveal">
          <div class="section-card-head">
            <h3>All Pending Complaints</h3>
            <select class="form-input" style="padding:6px 12px;font-size:.82rem;width:auto;" onchange="filterRows(this.value)">
              <option value="">All Status</option>
              <option value="open">Open</option>
              <option value="in-progress">In Progress</option>
              <option value="escalated">Escalated</option>
            </select>
          </div>
          <div id="complaintRows">
            ${pending.length ? pending.map(cRow).join('') : '<div class="empty-state">🎉 No pending complaints!</div>'}
          </div>
        </div>

        <div class="section-card reveal">
          <div class="section-card-head"><h3>Recently Resolved</h3></div>
          ${resolved.slice(0,5).map(c => {
            const cid = c.cmpId || c.id || '';
            return `<div class="c-row">
              <div style="flex:1;">
                <div style="font-family:var(--font-m);font-size:.75rem;color:var(--text-d);">#${cid} · ${(c.resolvedDate||c.date||'').split('T')[0]}</div>
                <div style="font-size:.9rem;font-weight:500;">${c.title}</div>
              </div>
              <span class="status-badge status-resolved">✓ Resolved</span>
              ${c.rating ? `<span style="color:var(--gold);font-size:.85rem;">${'⭐'.repeat(c.rating)}</span>` : ''}
            </div>`;
          }).join('') || '<div class="empty-state">No resolved complaints yet.</div>'}
        </div>`;

      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
      document.querySelectorAll('[data-target]').forEach(el => {
        const t = parseInt(el.dataset.target);
        if (!t) return;
        let s=0, step=Math.max(1,Math.ceil(t/40));
        const iv = setInterval(()=>{ s=Math.min(s+step,t); el.textContent=s; if(s>=t)clearInterval(iv); }, 30);
      });
    }

    function filterRows(val) {
      const rows = document.getElementById('complaintRows');
      if (!rows) return;
      const filtered = val
        ? _allComplaints.filter(c => c.status === val)
        : _allComplaints.filter(c => c.status !== 'resolved' && c.status !== 'closed');
      rows.innerHTML = filtered.length ? filtered.map(cRow).join('') : '<div class="empty-state">No complaints matching this filter.</div>';
    }

    function openUpdate(id) {
      const c = _allComplaints.find(x => (x.cmpId||x.id) === id);
      if (!c) return;
      document.getElementById('modalId').textContent = '#' + id;
      document.getElementById('modalCmpId').value = id;
      document.getElementById('newStatus').value = c.status || 'open';
      document.getElementById('officerRemarks').value = c.remarks || '';
      document.getElementById('estDate').value = '';
      const m = document.getElementById('updateModal');
      m.classList.add('open'); m.style.display='flex';
    }

    function closeModal() {
      const m = document.getElementById('updateModal');
      m.classList.remove('open'); m.style.display='none';
    }

    async function saveUpdate() {
      const id      = document.getElementById('modalCmpId').value;
      const status  = document.getElementById('newStatus').value;
      const remarks = document.getElementById('officerRemarks').value.trim();
      if (!remarks) { showToast && showToast('Please add officer remarks before saving.','warning'); return; }
      typeof showLoading === 'function' && showLoading('Saving update…');
      await dcmsUpdateComplaint(id, { status, remarks, officerId: u ? u.userId : null });
      typeof hideLoading === 'function' && hideLoading();
      closeModal();
      showToast && showToast('Complaint #' + id + ' updated to ' + status, 'success');
      // Refresh
      const fresh = dcmsGetComplaintsSync();
      renderDash(fresh);
      dcmsGetComplaints().then(d => { if (d && d.length) renderDash(d); }).catch(()=>{});
    }

    // Render immediately from localStorage, then update if backend responds
    const syncData = dcmsGetComplaintsSync();
    renderDash(syncData);

    dcmsGetComplaints().then(data => {
      if (data && data.length) renderDash(data);
    }).catch(() => {});
  </script>
</body>
</html>
