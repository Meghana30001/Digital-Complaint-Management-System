<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Dashboard — DCMS Citizen</title>
  <link rel="stylesheet" href="styles/main.css"/>
  <link rel="stylesheet" href="styles/animations.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    .dash-layout{display:flex;min-height:calc(100vh - 66px);padding-top:66px;}
    .sidebar{width:230px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);padding:28px 0;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;}
    .sidebar-section{margin-bottom:24px;}
    .sidebar-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-d);padding:0 20px;margin-bottom:8px;}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:.9rem;color:var(--text-m);transition:all .2s;border-left:3px solid transparent;text-decoration:none;}
    .sidebar-link:hover,.sidebar-link.active{color:var(--text);background:rgba(255,255,255,.04);}
    .sidebar-link.active{border-left-color:var(--accent);background:rgba(47,128,237,.07);color:var(--accent);}
    .sidebar-icon{font-size:1rem;width:20px;text-align:center;}
    .dash-main{flex:1;padding:36px 40px;overflow-x:hidden;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
    .topbar h1{font-family:var(--font-h);font-size:1.6rem;}
    .topbar p{color:var(--text-m);font-size:.9rem;margin-top:2px;}
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
    .kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:default;}
    .kpi:hover{border-color:var(--border-l);transform:translateY(-2px);}
    .kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
    .kpi-val{font-family:var(--font-h);font-size:1.6rem;}
    .kpi-lbl{font-size:.75rem;color:var(--text-d);}
    .section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;margin-bottom:24px;}
    .section-card-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .section-card-head h3{font-family:var(--font-h);font-size:1.1rem;}
    .c-row{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid rgba(30,43,66,.4);gap:12px;flex-wrap:wrap;cursor:pointer;transition:background .15s;}
    .c-row:last-child{border-bottom:none;}
    .c-row:hover{background:rgba(255,255,255,.02);}
    .c-id{font-family:var(--font-m);font-size:.75rem;color:var(--text-d);margin-bottom:2px;}
    .c-title{font-size:.9rem;font-weight:500;color:var(--text);}
    .c-dept{font-size:.78rem;color:var(--text-d);margin-top:2px;}
    .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
    .qa-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-l);padding:22px;display:flex;align-items:center;gap:14px;text-decoration:none;transition:all .2s;}
    .qa-card:hover{border-color:var(--border-l);transform:translateY(-2px);}
    .qa-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
    .qa-label{font-weight:500;color:var(--text);font-size:.95rem;margin-bottom:2px;}
    .qa-sub{font-size:.78rem;color:var(--text-d);}
    .tl-item{display:flex;gap:14px;padding:12px 24px;border-bottom:1px solid rgba(30,43,66,.3);}
    .tl-item:last-child{border-bottom:none;}
    .tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px;}
    .empty-state{padding:40px 24px;text-align:center;color:var(--text-d);}
    .empty-state .e-icon{font-size:2.5rem;margin-bottom:12px;}
    @media(max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:700px){.sidebar{display:none;}.dash-main{padding:20px 16px;}.quick-actions{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand"><span class="brand-icon">⬡</span><span class="brand-text">DCMS</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="citizen-dashboard.html" class="active">My Dashboard</a></li>
        <li><a href="file-complaint.html">File Complaint</a></li>
        <li><a href="track.html">Track</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">My Portal</div>
        <a href="citizen-dashboard.html" class="sidebar-link active"><span class="sidebar-icon">🏠</span> My Dashboard</a>
        <a href="file-complaint.html" class="sidebar-link"><span class="sidebar-icon">✍️</span> File Complaint</a>
        <a href="track.html" class="sidebar-link"><span class="sidebar-icon">🔍</span> Track Status</a>
        <a href="reports.html" class="sidebar-link"><span class="sidebar-icon">📊</span> Reports</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Account</div>
        <a href="profile.html" class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a>
        <a href="#" class="sidebar-link" onclick="dcmsLogout()"><span class="sidebar-icon">🚪</span> Logout</a>
      </div>
    </aside>

    <main class="dash-main" id="dashMain">
      <div style="padding:60px;text-align:center;color:var(--text-d);">
        <div style="font-size:2rem;margin-bottom:12px;">⏳</div>
        <p>Loading your dashboard…</p>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    (async () => {
      if (!await dcmsRequirePage('citizen')) return;
      dcmsSeedData();
      const data = await dcmsGetComplaints();
      renderDash(data || []);
    })();

    const u = dcmsGetUser();

    const SMAP = {
      'open':        { badge:'status-open',     label:'● Open' },
      'in-progress': { badge:'status-progress',  label:'◐ In Progress' },
      'resolved':    { badge:'status-resolved',  label:'✓ Resolved' },
      'escalated':   { badge:'status-open',      label:'⬆ Escalated' }
    };

    function greet() {
      const h = new Date().getHours();
      return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    }

    function cRow(c) {
      const sm  = SMAP[c.status] || SMAP['open'];
      const cid = c.cmpId || c.id || '';
      const dt  = (c.date || '').split('T')[0];
      return `<div class="c-row" onclick="window.location.href='track.html?id=${cid}'">
        <div>
          <div class="c-id">#${cid}</div>
          <div class="c-title">${c.title}</div>
          <div class="c-dept">${c.dept || c.category || '—'} · ${dt}</div>
        </div>
        <div style="text-align:right;">
          <span class="status-badge ${sm.badge}">${sm.label}</span>
          ${c.rating ? `<div style="font-size:.75rem;color:var(--gold);margin-top:4px;">${'⭐'.repeat(c.rating)}</div>` : ''}
        </div>
      </div>`;
    }

    function buildActivity(list) {
      if (!list.length) return '<div class="empty-state"><div class="e-icon">📭</div>No activity yet</div>';
      const dot = { resolved:'var(--green)', 'in-progress':'var(--accent)', open:'var(--border-l)', escalated:'var(--red)' };
      return list.slice(0,5).map(c => {
        const sm  = SMAP[c.status] || SMAP['open'];
        const cid = c.cmpId || c.id || '';
        return `<div class="tl-item">
          <div class="tl-dot" style="background:${dot[c.status]||'var(--border-l)'}"></div>
          <div>
            <div style="font-size:.88rem;font-weight:500;">${c.title}</div>
            <div style="font-size:.75rem;color:var(--text-d);">#${cid} · ${sm.label} · ${(c.date||'').split('T')[0]}</div>
          </div>
        </div>`;
      }).join('');
    }

    function renderDash(allComplaints) {
      const list = allComplaints || [];

      const total    = list.length;
      const resolved = list.filter(c => c.status === 'resolved').length;
      const progress = list.filter(c => c.status === 'in-progress').length;
      const open     = list.filter(c => c.status === 'open').length;

      document.getElementById('dashMain').innerHTML = `
        <div class="topbar">
          <div>
            <h1>${greet()}, ${u ? u.name.split(' ')[0] : 'there'} 👋</h1>
            <p>Here's the status of your complaints and recent activity.</p>
          </div>
          <a href="file-complaint.html" class="btn-primary pulse-glow">+ File New Complaint</a>
        </div>

        <div class="kpi-row">
          <div class="kpi reveal">
            <div class="kpi-icon" style="background:rgba(47,128,237,.12);">📝</div>
            <div><div class="kpi-val" data-target="${total}">${total}</div><div class="kpi-lbl">Total Filed</div></div>
          </div>
          <div class="kpi reveal reveal-d1">
            <div class="kpi-icon" style="background:rgba(52,211,153,.1);">✅</div>
            <div><div class="kpi-val" style="color:var(--green);" data-target="${resolved}">${resolved}</div><div class="kpi-lbl">Resolved</div></div>
          </div>
          <div class="kpi reveal reveal-d2">
            <div class="kpi-icon" style="background:rgba(251,191,36,.1);">⏳</div>
            <div><div class="kpi-val" style="color:var(--yellow);" data-target="${progress}">${progress}</div><div class="kpi-lbl">In Progress</div></div>
          </div>
          <div class="kpi reveal reveal-d3">
            <div class="kpi-icon" style="background:rgba(248,113,113,.1);">🔴</div>
            <div><div class="kpi-val" style="color:var(--red);" data-target="${open}">${open}</div><div class="kpi-lbl">Open</div></div>
          </div>
        </div>

        <div class="quick-actions reveal">
          <a href="file-complaint.html" class="qa-card">
            <div class="qa-icon" style="background:rgba(47,128,237,.12);">✍️</div>
            <div><div class="qa-label">File a Complaint</div><div class="qa-sub">Report a new issue to the relevant department</div></div>
          </a>
          <a href="track.html" class="qa-card">
            <div class="qa-icon" style="background:rgba(86,207,178,.12);">🔍</div>
            <div><div class="qa-label">Track Complaint</div><div class="qa-sub">Check progress using your Complaint ID</div></div>
          </a>
        </div>

        <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;">
          <div class="section-card reveal">
            <div class="section-card-head">
              <h3>My Complaints</h3>
              <a href="track.html" style="font-size:.82rem;color:var(--accent);">Track all →</a>
            </div>
            ${list.length
              ? list.map(cRow).join('')
              : '<div class="empty-state"><div class="e-icon">📭</div><p>No complaints filed yet.</p><a href="file-complaint.html" class="btn-primary" style="margin-top:12px;display:inline-block;">File First Complaint</a></div>'}
          </div>
          <div class="section-card reveal reveal-d1">
            <div class="section-card-head"><h3>Recent Activity</h3></div>
            ${buildActivity(list)}
          </div>
        </div>`;

      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
      document.querySelectorAll('[data-target]').forEach(el => {
        const t = parseFloat(el.dataset.target);
        if (!t) return;
        let s = 0, step = Math.max(1, t / 40);
        const iv = setInterval(() => { s = Math.min(s + step, t); el.textContent = Math.round(s); if (s >= t) clearInterval(iv); }, 30);
      });
    }

  </script>
</body>
</html>
